services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vnab_db
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer: # ← thêm mới
    image: adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  pgdata:
